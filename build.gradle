plugins {
    // Unobfuscated Loom for MC 26.x: no remapping, so the old mod* configurations
    // (modImplementation/modApi) no longer exist — use plain implementation + include.
    // 1.15.+ is the line Polymer itself builds 26.2 with.
    id 'net.fabricmc.fabric-loom-remap' version '1.14.+'
    id 'maven-publish'
}

base { archivesName = project.archives_base_name }
version = project.mod_version
group = project.maven_group

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' } // Polymer
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings line — 26.x ships unobfuscated (official Mojang names only).

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API is a standard server-side dependency; not bundled (admins install it).
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "eu.pb4:polymer-autohost:${project.polymer_version}"
    modImplementation "xyz.nucleoid:server-translations-api:${project.server_translations_api_version}"
    modImplementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
    modImplementation "eu.pb4:polymer-blocks:${project.polymer_version}"
    modImplementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    modImplementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
    modImplementation "eu.pb4:polymer-sound-patcher:${project.polymer_version}"

    include "eu.pb4:polymer-autohost:${project.polymer_version}"
    include "xyz.nucleoid:server-translations-api:${project.server_translations_api_version}"
    include "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    include "eu.pb4:polymer-core:${project.polymer_version}"
    include "eu.pb4:polymer-blocks:${project.polymer_version}"
    include "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    include "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
    include "eu.pb4:polymer-sound-patcher:${project.polymer_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
